<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoGuard Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Integrated Telemetry Bar */
        .ticker-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .ticker-label {
            color: #00e5ff;
            font-weight: 700;
            letter-spacing: 1.5px;
            white-space: nowrap;
            margin-right: 20px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            color: #38bdf8;
            opacity: 0.9;
            animation: marquee 35s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Background Network Canvas */
        #network-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Glass Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(4, 13, 33, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85),
                        0 0 35px rgba(0, 180, 255, 0.15);
            max-width: 460px;
            width: 90%;
            text-align: left;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 24px;
        }

        /* Local PNG Shield Image */
        .shield-image {
            width: 95px;
            height: auto;
            flex-shrink: 0;
            filter: drop-shadow(0 0 22px rgba(0, 229, 255, 0.75));
            transition: transform 0.3s ease;
        }

        .shield-image:hover {
            transform: scale(1.05);
        }

        .title-block {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .badge-tag {
            display: inline-block;
            align-self: flex-start;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.35);
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 3px 9px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Status Metrics Table */
        .status-table {
            background: rgba(2, 8, 22, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            color: #94a3b8;
        }

        .status-val {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00ffaa;
            font-weight: 600;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* Launch Button */
        .btn-launch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0066ff 0%, #00d4ff 100%);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            border-radius: 8px;
            box-shadow: 0 4px 22px rgba(0, 180, 255, 0.5);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 229, 255, 0.85);
        }

        .btn-launch:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .footer-note {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Dynamic SOC Telemetry Bar -->
    <div class="ticker-bar">
        <span class="ticker-label">SOC TELEMETRY FEED</span>
        <div class="ticker-wrap">
            <div id="soc-ticker" class="ticker-text">
                Initializing Live Telemetry Feed...
            </div>
        </div>
    </div>

    <!-- Background Constellation Canvas -->
    <canvas id="network-canvas"></canvas>

    <!-- Main Card -->
    <div class="card">
        <div class="card-header">
            <img src="{{ url_for('static', filename='shield.png') }}" alt="CryptoGuard Shield" class="shield-image">

            <div class="title-block">
                <h1>CryptoGuard</h1>
                <p class="subtitle">Threat Intelligence & EDR Platform</p>
                <div class="badge-tag">LOCAL ENGINE ACTIVE</div>
            </div>
        </div>
        
        <!-- Status Table -->
        <div class="status-table">
            <div class="status-row">
                <span class="status-label">Threat Intelligence</span>
                <span class="status-val"><span class="dot"></span> REAL-TIME</span>
            </div>
            <div class="status-row">
                <span class="status-label">EDR Sensor Network</span>
                <span class="status-val"><span class="dot"></span> OPERATIONAL</span>
            </div>
            <div class="status-row">
                <span class="status-label">System Health</span>
                <span class="status-val"><span class="dot"></span> SECURE</span>
            </div>
            <div class="status-row">
                <span class="status-label">Last Intelligence Update</span>
                <span id="live-time" class="status-val" style="color: #38bdf8; font-weight: 600;">--:--:-- UTC</span>
            </div>
        </div>

        <!-- Launch Button -->
        <button id="launch-btn" onclick="launchConsole()" class="btn-launch">
            Launch Desktop Console &rarr;
        </button>

        <div class="footer-note">Secure Access &bull; Real-Time System Protection</div>
    </div>
    
    <!-- JavaScript Real-time Handlers -->
    <script>
        // 1. LIVE REAL-TIME UTC CLOCK
        function updateLiveTime() {
            const now = new Date();
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds} UTC`;
        }
        setInterval(updateLiveTime, 1000);
        updateLiveTime();

        // 2. DYNAMIC REAL-TIME SOC LOG GENERATOR
        const logTemplates = [
            "ALERT: Suspicious PowerShell execution intercepted on WIN-HOST-01",
            "INFO: Threat Intelligence Feeds synced with global databases",
            "ALERT: Lateral movement attempt isolated on endpoint 10.0.4.12",
            "INFO: EDR Health Check complete — All process hooks active",
            "WARN: Unsigned binary execution blocked in temp directory",
            "INFO: AES-256 Master Key Pair successfully validated"
        ];

        let activeLogs = [];

        function generateTelemetry() {
            const now = new Date();
            const timeStr = now.toISOString().substr(11, 8);
            const randomMsg = logTemplates[Math.floor(Math.random() * logTemplates.length)];
            
            activeLogs.unshift(`[${timeStr} UTC] ${randomMsg}`);
            if (activeLogs.length > 5) activeLogs.pop();

            document.getElementById('soc-ticker').innerHTML = activeLogs.join("&nbsp;&nbsp;&bull;&nbsp;&nbsp;");
        }
        
        // Initialize and push new telemetry event every 4 seconds
        generateTelemetry();
        setInterval(generateTelemetry, 4000);

        // 3. AJAX LAUNCH HANDLER
        function launchConsole() {
            const btn = document.getElementById('launch-btn');
            
            btn.innerText = "INITIALIZING CONSOLE...";
            btn.disabled = true;

            fetch('/launch')
                .then(response => response.json())
                .then(data => {
                    btn.innerText = "CONSOLE ACTIVE";
                    btn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
                })
                .catch(err => {
                    console.error("Launch Error:", err);
                    btn.innerText = "LAUNCH FAILED - RETRY";
                    btn.disabled = false;
                });
        }

        // 4. BACKGROUND CONSTELLATION CANVAS
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const nodes = [];
        const nodeCount = 85;
        const maxDist = 140;

        class Node {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.radius = Math.random() * 2 + 1.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00e5ff';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00e5ff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < nodeCount; i++) {
            nodes.push(new Node());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();

                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        const opacity = (1 - dist / maxDist) * 0.45;
                        ctx.strokeStyle = `rgba(0, 212, 255, ${opacity})`;
                        ctx.lineWidth = 0.9;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
